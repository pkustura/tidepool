<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidepool</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    color-scheme: light dark;
    --bg: #EDF1EA;
    --surface: #E1E8DD;
    --surface-2: #D2DECD;
    --ink: #1C2B22;
    --ink-dim: #56685C;
    --accent: #C2762A;
    --accent-ink: #FFF8EC;
    --line: rgba(28,43,34,0.16);
    --attract: #2E9483;
    --repel: #C9563E;
    --shadow: rgba(20,30,24,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #071615;
      --surface: #0E211F;
      --surface-2: #163330;
      --ink: #E3EFE7;
      --ink-dim: #86A79B;
      --accent: #E3A34D;
      --accent-ink: #201404;
      --line: rgba(227,239,231,0.14);
      --attract: #4FC7B2;
      --repel: #E4785F;
      --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg: #071615;
    --surface: #0E211F;
    --surface-2: #163330;
    --ink: #E3EFE7;
    --ink-dim: #86A79B;
    --accent: #E3A34D;
    --accent-ink: #201404;
    --line: rgba(227,239,231,0.14);
    --attract: #4FC7B2;
    --repel: #E4785F;
    --shadow: rgba(0,0,0,0.5);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration: 0.001ms !important; }
  }

  .stage{ position: fixed; inset: 0; }
  canvas{ position: absolute; inset: 0; width: 100%; height: 100%; display:block; touch-action: none; cursor: grab; }

  .tag{
    position: absolute; top: 20px; left: 20px;
    max-width: min(320px, 42vw);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 12px 16px 13px;
    transform: rotate(-0.6deg);
    box-shadow: 0 6px 18px var(--shadow);
  }
  .tag::before{
    content:"";
    position:absolute; top:-7px; left: 22px;
    width: 34px; height: 14px;
    background: color-mix(in srgb, var(--accent) 30%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    transform: rotate(2deg);
  }
  .tag h1{
    margin: 0 0 3px;
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 560;
    font-size: clamp(22px, 3.4vw, 28px);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .tag p{
    margin: 0;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--ink-dim);
    font-style: italic;
    font-family: 'Fraunces', serif;
  }
  .tag .field{
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-dim);
    border-top: 1px dashed var(--line);
    padding-top: 7px;
  }

  .control-column{
    position: absolute; top: 20px; right: 20px; bottom: 20px;
    width: 260px; max-width: calc(100vw - 40px);
    display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin; scrollbar-color: var(--accent) transparent;
  }
  .control-column::-webkit-scrollbar{ width: 6px; }
  .control-column::-webkit-scrollbar-track{ background: transparent; }
  .control-column::-webkit-scrollbar-thumb{ background: var(--accent); border-radius: 3px; }

  #controls{
    --tp-base-background-color: color-mix(in srgb, var(--surface) 92%, transparent);
    --tp-base-shadow-color: var(--shadow);
    --tp-base-border-radius: 10px;
    --tp-button-background-color: var(--surface-2);
    --tp-button-background-color-active: var(--accent);
    --tp-button-background-color-focus: var(--surface-2);
    --tp-button-background-color-hover: color-mix(in srgb, var(--accent) 25%, var(--surface-2));
    --tp-button-foreground-color: var(--ink);
    --tp-container-background-color: color-mix(in srgb, var(--surface) 92%, transparent);
    --tp-container-background-color-active: var(--surface-2);
    --tp-container-background-color-focus: var(--surface-2);
    --tp-container-background-color-hover: var(--surface-2);
    --tp-container-foreground-color: var(--ink);
    --tp-groove-foreground-color: var(--line);
    --tp-input-background-color: var(--surface-2);
    --tp-input-background-color-active: color-mix(in srgb, var(--accent) 30%, var(--surface-2));
    --tp-input-background-color-focus: color-mix(in srgb, var(--accent) 20%, var(--surface-2));
    --tp-input-background-color-hover: color-mix(in srgb, var(--accent) 15%, var(--surface-2));
    --tp-input-foreground-color: var(--accent);
    --tp-label-foreground-color: var(--ink-dim);
    --tp-monitor-background-color: var(--surface-2);
    --tp-monitor-foreground-color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .readout{
    position: absolute; bottom: 20px; left: 20px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 6px 18px var(--shadow);
    padding: 12px 14px;
    display:flex; gap: 16px; align-items:center;
  }
  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat span{ font-size: 9.5px; letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-dim); }
  .stat b{
    font-family:'IBM Plex Mono', monospace; font-size: 15px; font-weight:500;
    font-variant-numeric: tabular-nums;
  }

  .matrix{
    flex: none;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 6px 18px var(--shadow);
    padding: 11px 13px 12px;
  }
  .matrix h2{
    margin:0 0 8px; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.11em; text-transform: uppercase;
    color: var(--ink-dim); font-family: 'IBM Plex Mono', monospace;
  }
  .grid{ display:grid; gap: 3px; }
  .cell{ width: 16px; height: 16px; border-radius: 2px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .mrow{ display:flex; align-items:center; gap: 4px; }
  .mrow + .mrow{ margin-top: 3px; }
  .bandlabel{
    font-size: 9.5px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--ink-dim); margin: 8px 0 5px;
  }
  .bandlabel:first-of-type{ margin-top: 0; }
  .legend{
    display:flex; gap: 12px; margin-top: 9px; padding-top: 8px;
    border-top: 1px dashed var(--line); font-size: 10px; color: var(--ink-dim);
  }
  .legend span{ display:flex; align-items:center; gap: 5px; }
  .swatch{ width:9px; height:9px; border-radius:2px; }

  @media (max-width: 620px){
    .tag{ max-width: calc(100vw - 40px); }
    .control-column{ top: auto; bottom: 20px; right: 20px; left: 20px; width:auto; }
    .readout, .matrix{ display:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <canvas id="pool" aria-label="Simulated tidepool of interacting particle colonies"></canvas>

  <header class="tag">
    <h1>Tidepool</h1>
    <p>a colony under glass — nudge the water and watch it reorganize</p>
    <div class="field">Specimen no. <span id="specimenNo">0001</span></div>
  </header>

  <div class="control-column">
    <div id="controls" aria-label="Controls"></div>

    <aside class="matrix" aria-label="Group affinity matrices">
      <h2>Affinities</h2>
      <div class="bandlabel">Near</div>
      <div id="matrixNear"></div>
      <div class="bandlabel">Far</div>
      <div id="matrixFar"></div>
      <div class="legend">
        <span><i class="swatch" style="background:var(--attract)"></i>attracts</span>
        <span><i class="swatch" style="background:var(--repel)"></i>repels</span>
      </div>
    </aside>
  </div>

  <div class="readout">
    <div class="stat"><span>Generation</span><b id="genStat">0</b></div>
    <div class="stat"><span>Population</span><b id="popStat">0</b></div>
  </div>
</div>

<script type="module">
import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js';

  const canvas = document.getElementById('pool');
  const ctx = canvas.getContext('2d');
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  let W = 0, H = 0;

  function resize(){
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);

  const PALETTE = [
    { name:'cyan',    hex:'#4FD9E8' },
    { name:'magenta', hex:'#E85FB0' },
    { name:'lime',    hex:'#B7DE3E' },
    { name:'amber',   hex:'#F2A93C' },
    { name:'violet',  hex:'#9B84E8' },
    { name:'rose',    hex:'#EE7F7F' }
  ];

  const COLLISION_R = 8;
  const STIR_RADIUS = 150;
  const STIR_STRENGTH = 0.9;
  const WALL_MARGIN = 28;
  const WALL_FORCE = 0.35;
  const WALL_DAMP = 0.35;
  const FORCE_SCALE = 0.62;
  const MIN_ZOOM = 0.12, MAX_ZOOM = 4;

  const state = {
    groupCount: 5,
    population: 1200,
    momentum: 0.75,
    reach: 35,
    paused: false,
    specimenNo: 0,
    generation: 0,
    ruleMode: 'random',
    spaceSize: 1600,
    timeScale: 1,
    trailAlpha: 0.7
  };

  // World space is the fixed simulation domain (walls, seeding, spatial grid
  // all live here). The camera maps a window of it onto the viewport (W,H),
  // so "Space" can grow the tank independently of screen size.
  let WORLD_W = state.spaceSize, WORLD_H = state.spaceSize;
  const camera = { cx: WORLD_W/2, cy: WORLD_H/2, zoom: 1 };

  function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }

  function fitCamera(){
    camera.cx = WORLD_W/2;
    camera.cy = WORLD_H/2;
    const pad = 40;
    camera.zoom = clamp(Math.min((W-pad)/WORLD_W, (H-pad)/WORLD_H), MIN_ZOOM, MAX_ZOOM);
  }

  function applyCameraTransform(){
    const s = dpr*camera.zoom;
    ctx.setTransform(s,0,0,s, dpr*(W/2 - camera.cx*camera.zoom), dpr*(H/2 - camera.cy*camera.zoom));
  }

  let px, py, vx, vy, sp, N;
  // Force accumulators — reused across frames (zeroed, not reallocated)
  // to avoid a fresh N-length allocation twice per step at high population.
  let fx, fy;
  // Ping-pong scratch for step()'s counting sort: every frame, particles
  // are physically rebucketed into cell order for cache locality, scattered
  // into these before px/py/vx/vy/sp swap references with them. cellOf
  // holds each particle's cell index for the duration of that sort.
  let pxB, pyB, vxB, vyB, spB, cellOf;
  let ruleNear, ruleFar; // Float32Array groupCount*groupCount, each

  function rnd(a,b){ return a + Math.random()*(b-a); }

  const NEAR_SELF_RANGE = [-0.3, 0.6];
  const FAR_SELF_RANGE = [-0.4, 0.4];

  function makeUniformSet(count, selfRange){
    const m = new Float32Array(count*count);
    for (let i=0;i<count;i++){
      for (let j=0;j<count;j++){
        m[i*count+j] = i===j ? rnd(selfRange[0], selfRange[1]) : rnd(-1, 1);
      }
    }
    return m;
  }

  // Each regime is a distinct hypothesis about what makes group affinities
  // produce compelling self-organization. Near = short-range bonding/adhesion,
  // Far = a longer, weaker field (electrostatic/chemotactic-style pull).
  const RULE_MODES = {
    random: {
      label: 'Random',
      gen(count){
        return {
          near: makeUniformSet(count, NEAR_SELF_RANGE),
          far: makeUniformSet(count, FAR_SELF_RANGE)
        };
      }
    },
    bonded: {
      label: 'Bonded',
      // Near/far are anti-correlated in sign for most pairs, so a pair mostly
      // settles at a preferred separation (attract close + repel far, or the
      // reverse) instead of both bands pulling the same way. This is the
      // mechanism behind stable shells/orbits rather than blobs or gas.
      gen(count){
        const ANTI_CORR = 0.75;
        const near = new Float32Array(count*count);
        const far = new Float32Array(count*count);
        for (let i=0;i<count;i++){
          for (let j=0;j<count;j++){
            const idx = i*count+j;
            const isSelf = i===j;
            const nearVal = isSelf ? rnd(NEAR_SELF_RANGE[0], NEAR_SELF_RANGE[1]) : rnd(-1, 1);
            const farRange = isSelf ? FAR_SELF_RANGE : [-1, 1];
            const farMag = Math.abs(rnd(farRange[0], farRange[1]));
            let farSign = nearVal >= 0 ? -1 : 1;
            if (Math.random() > ANTI_CORR) farSign = Math.random() < 0.5 ? 1 : -1;
            near[idx] = nearVal;
            far[idx] = farMag * farSign;
          }
        }
        return { near, far };
      }
    }
  };
  const RULE_MODE_KEYS = Object.keys(RULE_MODES);

  function makeRules(count){
    const mode = RULE_MODES[state.ruleMode] || RULE_MODES[RULE_MODE_KEYS[0]];
    const pair = mode.gen(count);
    ruleNear = pair.near;
    ruleFar = pair.far;
  }

  // Mass scales how much a given force accelerates a group (a = F/m); it
  // does not make the underlying near/far rules reciprocal, so a lopsided
  // affinity between two groups still self-propels the pair as before —
  // mass just changes how much each side of that pair moves in response.
  const MASS_MIN = 0.5, MASS_MAX = 2.2;
  let groupMass;
  function initMass(count){
    groupMass = new Float32Array(count);
    for (let i=0;i<count;i++) groupMass[i] = rnd(MASS_MIN, MASS_MAX);
  }

  // Relative population share per group — weights, not fractions (like
  // parts in a recipe), so a 2:1 weight ratio holds regardless of how many
  // groups exist. This is what lets a minority group end up consistently
  // flanked by a majority partner, i.e. fixed-stoichiometry structure.
  const WEIGHT_MIN = 0.3, WEIGHT_MAX = 3;
  let groupWeight;
  function initWeights(count){
    groupWeight = new Float32Array(count);
    for (let i=0;i<count;i++) groupWeight[i] = rnd(WEIGHT_MIN, WEIGHT_MAX);
  }
  function sampleGroup(){
    let total = 0;
    for (let i=0;i<groupWeight.length;i++) total += groupWeight[i];
    let r = Math.random()*total;
    for (let i2=0;i2<groupWeight.length;i2++){
      r -= groupWeight[i2];
      if (r <= 0) return i2;
    }
    return groupWeight.length-1;
  }

  function seedParticles(n){
    N = n;
    px = new Float32Array(n); py = new Float32Array(n);
    vx = new Float32Array(n); vy = new Float32Array(n);
    sp = new Uint8Array(n);
    fx = new Float32Array(n); fy = new Float32Array(n);
    pxB = new Float32Array(n); pyB = new Float32Array(n);
    vxB = new Float32Array(n); vyB = new Float32Array(n);
    spB = new Uint8Array(n);
    cellOf = new Int32Array(n);
    for (let i=0;i<n;i++){
      px[i] = rnd(WORLD_W*0.1, WORLD_W*0.9);
      py[i] = rnd(WORLD_H*0.1, WORLD_H*0.9);
      vx[i] = 0; vy[i] = 0;
      sp[i] = sampleGroup();
    }
  }

  function newColony(){
    state.specimenNo++;
    document.getElementById('specimenNo').textContent = String(state.specimenNo).padStart(4,'0');
    makeRules(state.groupCount);
    initMass(state.groupCount);
    initWeights(state.groupCount);
    seedParticles(state.population);
    state.generation = 0;
    renderMatrix();
    refreshPhysiologyUI();
  }

  function scatter(){
    for (let i=0;i<N;i++){
      px[i] = rnd(WORLD_W*0.1, WORLD_W*0.9);
      py[i] = rnd(WORLD_H*0.1, WORLD_H*0.9);
      vx[i] = 0; vy[i] = 0;
    }
  }

  // --- spatial grid ---
  // Half-stencil: 4 of the 8 neighbor directions, chosen so every pair of
  // adjacent cells is covered by exactly one of them (E/W, SE/NW, S/N,
  // SW/NE are opposite pairs — this set picks exactly one from each). Lets
  // step() visit each cell-pair once instead of visiting all 8 and
  // discarding half the candidates via an index check.
  const HALF_STENCIL = [[1,0],[1,1],[0,1],[-1,1]];
  // CSR-style grid: cellStart[c]..cellStart[c+1] is the range, in the
  // current frame's cell-sorted particle arrays, belonging to cell c.
  // Rebuilt fresh every step() call via counting sort (see step()); cursor
  // is scratch used only during that sort's scatter pass.
  let cellSize, invCellSize, cols, rows, cellStart, cursor;
  function buildGrid(){
    cellSize = Math.max(20, state.reach);
    invCellSize = 1/cellSize;
    cols = Math.max(1, Math.ceil(WORLD_W/cellSize));
    rows = Math.max(1, Math.ceil(WORLD_H/cellSize));
    const numCells = cols*rows;
    cellStart = new Int32Array(numCells+1);
    cursor = new Int32Array(numCells);
  }

  function cellIndex(x,y){
    const cx = Math.min(cols-1, Math.max(0, (x*invCellSize)|0));
    const cy = Math.min(rows-1, Math.max(0, (y*invCellSize)|0));
    return cy*cols+cx;
  }

  // --- pointer stir ---
  const pointer = { active:false, x:0, y:0 };
  function pointerPos(e){
    const r = canvas.getBoundingClientRect();
    const sx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const sy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    // screen (CSS px) -> world space, so stir math stays in the same
    // coordinates as particle positions regardless of pan/zoom
    return {
      x: camera.cx + (sx - W/2)/camera.zoom,
      y: camera.cy + (sy - H/2)/camera.zoom
    };
  }
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const wx = camera.cx + (sx - W/2)/camera.zoom;
    const wy = camera.cy + (sy - H/2)/camera.zoom;
    const newZoom = clamp(camera.zoom * Math.exp(-e.deltaY*0.0015), MIN_ZOOM, MAX_ZOOM);
    camera.cx = wx - (sx - W/2)/newZoom;
    camera.cy = wy - (sy - H/2)/newZoom;
    camera.zoom = newZoom;
  }, { passive:false });
  // plain drag pans the camera; shift+drag stirs the water. Decided once
  // at pointerdown so a drag doesn't switch modes mid-gesture.
  let dragMode = null; // 'pan' | 'stir'
  const dragLast = { x:0, y:0 };
  canvas.addEventListener('pointerdown', (e) => {
    const r = canvas.getBoundingClientRect();
    dragLast.x = e.clientX - r.left;
    dragLast.y = e.clientY - r.top;
    if (e.shiftKey){
      dragMode = 'stir';
      pointer.active = true;
      const p = pointerPos(e); pointer.x = p.x; pointer.y = p.y;
      canvas.style.cursor = 'crosshair';
    } else {
      dragMode = 'pan';
      canvas.style.cursor = 'grabbing';
    }
  });
  window.addEventListener('pointermove', (e) => {
    if (!dragMode) return;
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    if (dragMode === 'stir'){
      const p = pointerPos(e); pointer.x = p.x; pointer.y = p.y;
    } else {
      camera.cx -= (sx - dragLast.x)/camera.zoom;
      camera.cy -= (sy - dragLast.y)/camera.zoom;
    }
    dragLast.x = sx; dragLast.y = sy;
  });
  window.addEventListener('pointerup', () => {
    pointer.active = false;
    dragMode = null;
    canvas.style.cursor = 'grab';
  });
  canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Shift' && !dragMode) canvas.style.cursor = 'crosshair';
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'Shift' && !dragMode) canvas.style.cursor = 'grab';
  });

  function step(){
    const reach = state.reach;
    const reach2 = reach*reach;
    const col = COLLISION_R;
    const mid = col + (reach-col)*0.5;
    const mom = state.momentum;
    const count = state.groupCount;

    // Precomputed inverses, constant for the whole step: lets the pair
    // kernel below replace a division with a multiply for the collision
    // ramp and both band interpolants.
    const invCol = 1/col;
    const invMidSpan = 1/(mid-col);
    const invFarSpan = 1/(reach-mid);

    // Group-indexed accel scalars (F/m), rebuilt every step — groupCount
    // is at most 6, so this is cheap, and it can't go stale if a mass
    // slider was dragged mid-frame the way a cached version could.
    const accel = new Float32Array(count);
    for (let g=0; g<count; g++) accel[g] = FORCE_SCALE/groupMass[g];

    // Hot-path locals declared once and reassigned across iterations
    // (never re-declared per iteration) — same reuse discipline `var`
    // gave us for free, kept explicit here since this loop runs
    // millions of times per step at high population.
    let i, spi, si, pxi, pyi, fxi, fyi;
    let ny, nx, j, ddx, ddy, d2, d, invD, fij, fji, sij, sji;
    let rep, t, tri, t2, tri2, oi, neighCount;
    let start, end, neighStart, neighEnd, cellId, c, dest;
    const neighRange = new Int32Array(8); // [start0,end0, start1,end1, ...]
    const numCells = cols*rows;

    // Counting sort: find each particle's current cell, prefix-sum to get
    // per-cell ranges, then physically scatter px/py/vx/vy/sp into cell
    // order (via the pxB/pyB/vxB/vyB/spB scratch, swapped in after). This
    // replaces the old array-of-JS-arrays buckets (built fresh via N
    // `.push()` calls every frame) with one flat, contiguous layout, and
    // lets the force loop below read same-cell and neighbor-cell particles
    // as a straight typed-array scan instead of chasing per-cell arrays.
    //
    // Because the scatter is stable but the *input* order it's stable
    // relative to is last frame's already-reordered layout (not each
    // particle's original absolute index), the pairs below accumulate in
    // a different sequence than the pre-CSR version from the second frame
    // on. Floating-point addition isn't associative, so this changes
    // exact trajectories — same category as the division changes earlier
    // in this file, verified by running the sim, not by diffing output.
    cellStart.fill(0);
    for (i=0;i<N;i++){
      c = cellIndex(px[i], py[i]);
      cellOf[i] = c;
      cellStart[c+1]++;
    }
    for (c=1;c<=numCells;c++) cellStart[c] += cellStart[c-1];
    cursor.set(cellStart.subarray(0, numCells));
    for (i=0;i<N;i++){
      c = cellOf[i];
      dest = cursor[c]++;
      pxB[dest] = px[i]; pyB[dest] = py[i];
      vxB[dest] = vx[i]; vyB[dest] = vy[i];
      spB[dest] = sp[i];
    }
    let tmp;
    tmp = px; px = pxB; pxB = tmp;
    tmp = py; py = pyB; pyB = tmp;
    tmp = vx; vx = vxB; vxB = tmp;
    tmp = vy; vy = vyB; vyB = tmp;
    tmp = sp; sp = spB; spB = tmp;

    fx.fill(0);
    fy.fill(0);

    for (let cy=0; cy<rows; cy++){
      for (let cx=0; cx<cols; cx++){
        cellId = cy*cols+cx;
        start = cellStart[cellId]; end = cellStart[cellId+1];
        if (start === end) continue;

        // Neighbor ranges depend only on (cy,cx), not on which particle in
        // this cell we're at — looked up once per cell instead of once
        // per particle in it (previously end-start times).
        neighCount = 0;
        for (oi=0; oi<4; oi++){
          ny = cy+HALF_STENCIL[oi][1]; if (ny<0||ny>=rows) continue;
          nx = cx+HALF_STENCIL[oi][0]; if (nx<0||nx>=cols) continue;
          const nId = ny*cols+nx;
          neighRange[neighCount*2] = cellStart[nId];
          neighRange[neighCount*2+1] = cellStart[nId+1];
          neighCount++;
        }

        for (i=start; i<end; i++){
          // avoids recomputing sp[i]*count and re-reading px[i]/py[i] on
          // every candidate pair, and accumulates i's side of the force
          // in locals instead of a typed-array read-modify-write per pair
          spi = sp[i];
          si = spi*count;
          pxi = px[i]; pyi = py[i];
          fxi = 0; fyi = 0;

          // Same-cell pairs: forward-only within [start,end) (j>i), so
          // every unordered pair in this cell is visited exactly once —
          // no index-based dedup check needed like the old `j<=i`.
          for (j=i+1; j<end; j++){
            ddx = px[j]-pxi;
            ddy = py[j]-pyi;
            d2 = ddx*ddx+ddy*ddy;
            if (d2 > reach2 || d2 < 0.0001) continue;
            d = Math.sqrt(d2);
            invD = 1/d;

            if (d < col){
              rep = d*invCol - 1;
              fij = rep; fji = rep;
            } else if (d < mid){
              t = (d - col) * invMidSpan;
              tri = 1 - Math.abs(2*t - 1);
              fij = ruleNear[si+sp[j]] * tri;
              fji = ruleNear[sp[j]*count+spi] * tri;
            } else {
              t2 = (d - mid) * invFarSpan;
              tri2 = 1 - Math.abs(2*t2 - 1);
              fij = ruleFar[si+sp[j]] * tri2;
              fji = ruleFar[sp[j]*count+spi] * tri2;
            }
            // ddx*(f*invD) is the same unit vector scaling as (ddx/d)*f,
            // just one division instead of two (ux and uy no longer
            // computed separately).
            sij = fij*invD; sji = fji*invD;
            fxi += ddx*sij; fyi += ddy*sij;
            fx[j] -= ddx*sji; fy[j] -= ddy*sji;
          }

          // Cross-cell pairs: only the neighbor ranges looked up above for
          // this cell — each adjacent cell-pair is covered from exactly
          // one side (see HALF_STENCIL above), so again no `j<=i` dedup.
          for (oi=0; oi<neighCount; oi++){
            neighStart = neighRange[oi*2]; neighEnd = neighRange[oi*2+1];
            for (j=neighStart; j<neighEnd; j++){
              ddx = px[j]-pxi;
              ddy = py[j]-pyi;
              d2 = ddx*ddx+ddy*ddy;
              if (d2 > reach2 || d2 < 0.0001) continue;
              d = Math.sqrt(d2);
              invD = 1/d;

              if (d < col){
                rep = d*invCol - 1;
                fij = rep; fji = rep;
              } else if (d < mid){
                t = (d - col) * invMidSpan;
                tri = 1 - Math.abs(2*t - 1);
                fij = ruleNear[si+sp[j]] * tri;
                fji = ruleNear[sp[j]*count+spi] * tri;
              } else {
                t2 = (d - mid) * invFarSpan;
                tri2 = 1 - Math.abs(2*t2 - 1);
                fij = ruleFar[si+sp[j]] * tri2;
                fji = ruleFar[sp[j]*count+spi] * tri2;
              }
              sij = fij*invD; sji = fji*invD;
              fxi += ddx*sij; fyi += ddy*sij;
              fx[j] -= ddx*sji; fy[j] -= ddy*sji;
            }
          }

          fx[i] += fxi; fy[i] += fyi;
        }
      }
    }

    // pointer stir (tangential swirl)
    if (pointer.active){
      const stirAccel = new Float32Array(count);
      for (let g=0; g<count; g++) stirAccel[g] = STIR_STRENGTH/groupMass[g];
      for (let i2=0;i2<N;i2++){
        const ddx2 = px[i2]-pointer.x, ddy2 = py[i2]-pointer.y;
        const d2b = ddx2*ddx2+ddy2*ddy2;
        if (d2b < STIR_RADIUS*STIR_RADIUS && d2b > 1){
          const db = Math.sqrt(d2b);
          const falloff = 1 - db/STIR_RADIUS;
          const invDb = 1/db;
          const ux2 = ddx2*invDb, uy2 = ddy2*invDb;
          const sAcc = stirAccel[sp[i2]] * falloff;
          vx[i2] += (-uy2) * sAcc;
          vy[i2] += ( ux2) * sAcc;
        }
      }
    }

    for (let k=0;k<N;k++){
      vx[k] = (vx[k] + fx[k]*accel[sp[k]]) * mom;
      vy[k] = (vy[k] + fy[k]*accel[sp[k]]) * mom;
      const nx2 = px[k]+vx[k], ny2 = py[k]+vy[k];

      if (nx2 < WALL_MARGIN){ vx[k] += (WALL_MARGIN-nx2)*WALL_FORCE*0.1; if (vx[k] < 0) vx[k] *= (1-WALL_DAMP); }
      if (nx2 > WORLD_W-WALL_MARGIN){ vx[k] -= (nx2-(WORLD_W-WALL_MARGIN))*WALL_FORCE*0.1; if (vx[k] > 0) vx[k] *= (1-WALL_DAMP); }
      if (ny2 < WALL_MARGIN){ vy[k] += (WALL_MARGIN-ny2)*WALL_FORCE*0.1; if (vy[k] < 0) vy[k] *= (1-WALL_DAMP); }
      if (ny2 > WORLD_H-WALL_MARGIN){ vy[k] -= (ny2-(WORLD_H-WALL_MARGIN))*WALL_FORCE*0.1; if (vy[k] > 0) vy[k] *= (1-WALL_DAMP); }

      px[k] = Math.min(WORLD_W-2, Math.max(2, px[k]+vx[k]));
      py[k] = Math.min(WORLD_H-2, Math.max(2, py[k]+vy[k]));

      // inelastic contact: a particle pinned at the literal edge can't keep
      // accumulating velocity into the glass frame after frame
      if (px[k] <= 2 && vx[k] < 0) vx[k] = 0;
      if (px[k] >= WORLD_W-2 && vx[k] > 0) vx[k] = 0;
      if (py[k] <= 2 && vy[k] < 0) vy[k] = 0;
      if (py[k] >= WORLD_H-2 && vy[k] > 0) vy[k] = 0;
    }
  }

  let bgColor = '#EDF1EA';
  function readBg(){
    bgColor = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || bgColor;
  }
  function hexToRgb(hex){
    const v = parseInt(hex.replace('#',''),16);
    return [(v>>16)&255, (v>>8)&255, v&255];
  }
  let bgRgb = hexToRgb('#edf1ea');

  function draw(){
    readBg();
    bgRgb = hexToRgb(bgColor.length===7 ? bgColor : '#edf1ea');
    // trail wash happens in plain viewport space so it always covers the
    // full canvas regardless of camera pan/zoom
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = `rgba(${bgRgb[0]},${bgRgb[1]},${bgRgb[2]},${1 - state.trailAlpha})`;
    ctx.fillRect(0,0,W,H);

    applyCameraTransform();

    // One path + one fill per color instead of per particle: fill() is the
    // expensive call, and grouping by color (there are only PALETTE.length
    // of them, independent of groupCount/sp[i]%len wraparound) turns N
    // fills into a handful. moveTo before each arc breaks the subpath so
    // canvas doesn't draw a connecting line between consecutive dots.
    const R = 1.6;
    for (let g=0; g<PALETTE.length; g++){
      ctx.fillStyle = PALETTE[g].hex;
      ctx.beginPath();
      for (let i=0;i<N;i++){
        if (sp[i] % PALETTE.length !== g) continue;
        ctx.moveTo(px[i]+R, py[i]);
        ctx.arc(px[i], py[i], R, 0, Math.PI*2);
      }
      ctx.fill();
    }

    if (pointer.active){
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(140,140,140,0.35)';
      ctx.lineWidth = 1/camera.zoom;
      ctx.arc(pointer.x, pointer.y, STIR_RADIUS, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  const genEl = document.getElementById('genStat');
  const popEl = document.getElementById('popStat');

  let stepAcc = 0;
  window.__prof = { step: 0, draw: 0, frames: 0 };
  window.__sim = { state, seedParticles, newColony, buildGrid, fitCamera };
  function loop(){
    if (!state.paused){
      // fixed-step physics decoupled from render rate: timeScale > 1 runs
      // multiple steps per frame, timeScale < 1 skips frames, so the same
      // dynamics can be examined slower or faster without changing them
      stepAcc += state.timeScale;
      const t0 = performance.now();
      while (stepAcc >= 1){
        step();
        state.generation++;
        stepAcc -= 1;
      }
      window.__prof.step += performance.now() - t0;
    }
    const t1 = performance.now();
    draw();
    window.__prof.draw += performance.now() - t1;
    window.__prof.frames++;
    if (state.generation % 6 === 0){
      genEl.textContent = state.generation.toLocaleString();
      popEl.textContent = N;
    }
    requestAnimationFrame(loop);
  }

  function renderRuleGrid(container, ruleArr, count, bandName){
    container.innerHTML = '';
    container.style.gridTemplateColumns = `9px repeat(${count}, 16px)`;
    container.className = 'grid';

    const headRow = document.createElement('div');
    headRow.style.display = 'contents';
    const blank = document.createElement('div');
    headRow.appendChild(blank);
    for (let c=0;c<count;c++){
      const hd = document.createElement('div');
      hd.style.display='flex'; hd.style.justifyContent='center'; hd.style.alignItems='flex-end';
      const dot = document.createElement('span'); dot.className='dot';
      dot.style.background = PALETTE[c].hex;
      hd.appendChild(dot);
      headRow.appendChild(hd);
    }
    container.appendChild(headRow);

    for (let r=0;r<count;r++){
      const rowWrap = document.createElement('div');
      rowWrap.style.display = 'contents';
      const rlabel = document.createElement('span'); rlabel.className='dot';
      rlabel.style.background = PALETTE[r].hex;
      rlabel.style.alignSelf = 'center';
      rowWrap.appendChild(rlabel);
      for (let c2=0;c2<count;c2++){
        const val = ruleArr[r*count+c2];
        const cell = document.createElement('div');
        cell.className = 'cell';
        const mag = Math.min(1, Math.abs(val));
        const base = val >= 0 ? 'var(--attract)' : 'var(--repel)';
        cell.style.background = `color-mix(in srgb, ${base} ${Math.round(mag*85+8)}%, var(--surface-2))`;
        cell.title = `${bandName}: ${PALETTE[r].name} ← ${PALETTE[c2].name}: ${val>=0?'+':''}${val.toFixed(2)}`;
        rowWrap.appendChild(cell);
      }
      container.appendChild(rowWrap);
    }
  }

  function renderMatrix(){
    const count = state.groupCount;
    renderRuleGrid(document.getElementById('matrixNear'), ruleNear, count, 'Near');
    renderRuleGrid(document.getElementById('matrixFar'), ruleFar, count, 'Far');
  }

  // --- controls wiring (Tweakpane) ---
  const pane = new Pane({ title: 'Instrument', container: document.getElementById('controls') });

  pane.addButton({ title: 'New colony' }).on('click', newColony);
  pane.addButton({ title: 'Scatter' }).on('click', scatter);

  const btnPause = pane.addButton({ title: 'Pause' });
  btnPause.on('click', () => {
    state.paused = !state.paused;
    btnPause.title = state.paused ? 'Resume' : 'Pause';
  });

  const regimeOptions = Object.fromEntries(RULE_MODE_KEYS.map((k) => [RULE_MODES[k].label, k]));
  pane.addBinding(state, 'ruleMode', { label: 'Regime', options: regimeOptions }).on('change', newColony);

  pane.addBinding(state, 'groupCount', { label: 'Group', min: 1, max: 6, step: 1 }).on('change', newColony);

  // Render, not physics — how much the previous frame fades instead of
  // being cleared. Low = long comet trails, high = crisp/no trail.
  pane.addBinding(state, 'trailAlpha', { label: 'Trail', min: 0.02, max: 1, step: 0.01 });

  const dynFolder = pane.addFolder({ title: 'Dynamics', expanded: true });
  dynFolder.addBinding(state, 'population', { label: 'Population', min: 200, max: 50000, step: 100 })
    .on('change', () => { seedParticles(state.population); });
  dynFolder.addBinding(state, 'momentum', { label: 'Momentum', min: 0.5, max: 0.99, step: 0.01 });
  dynFolder.addBinding(state, 'reach', { label: 'Reach', min: 15, max: 150, step: 5 })
    .on('change', buildGrid);
  dynFolder.addBinding(state, 'spaceSize', { label: 'Space', min: 600, max: 6000, step: 200 })
    .on('change', () => {
      WORLD_W = state.spaceSize;
      WORLD_H = state.spaceSize;
      buildGrid();
      fitCamera();
    });
  dynFolder.addBinding(state, 'timeScale', { label: 'Speed', min: 0.1, max: 4, step: 0.1 });
  dynFolder.addButton({ title: 'Randomize' }).on('click', () => {
    state.momentum = +rnd(0.5, 0.99).toFixed(2);
    state.reach = Math.round(rnd(15, 150) / 5) * 5;
    state.spaceSize = Math.round(rnd(600, 6000) / 200) * 200;
    state.timeScale = +rnd(0.1, 4).toFixed(1);
    WORLD_W = state.spaceSize;
    WORLD_H = state.spaceSize;
    buildGrid();
    fitCamera();
    pane.refresh();
  });

  const physioFolder = pane.addFolder({ title: 'Physiology', expanded: true });
  // The Randomize button is disposed and re-added last on every refresh so
  // it stays pinned to the bottom, below the rebuilt Mass/Ratio folders.
  let massFolder, ratioFolder, btnPhysioRandom;
  function refreshPhysiologyUI(){
    if (massFolder) massFolder.dispose();
    if (ratioFolder) ratioFolder.dispose();
    if (btnPhysioRandom) btnPhysioRandom.dispose();
    massFolder = physioFolder.addFolder({ title: 'Mass', expanded: true });
    ratioFolder = physioFolder.addFolder({ title: 'Ratio', expanded: false });
    // `let i` gives each iteration's closures their own binding, so the
    // old IIFE-per-iteration workaround this used under `var` is gone.
    for (let i=0;i<state.groupCount;i++){
      const mProxy = { v: groupMass[i] };
      massFolder.addBinding(mProxy, 'v', { label: PALETTE[i].name, min: MASS_MIN, max: MASS_MAX, step: 0.05 })
        .on('change', (ev) => { groupMass[i] = ev.value; });
      const rProxy = { v: groupWeight[i] };
      ratioFolder.addBinding(rProxy, 'v', { label: PALETTE[i].name, min: WEIGHT_MIN, max: WEIGHT_MAX, step: 0.05 })
        .on('change', (ev) => { groupWeight[i] = ev.value; seedParticles(state.population); });
    }
    btnPhysioRandom = physioFolder.addButton({ title: 'Randomize' }).on('click', () => {
      initMass(state.groupCount);
      initWeights(state.groupCount);
      seedParticles(state.population);
      refreshPhysiologyUI();
    });
  }

  // --- init ---
  resize();
  buildGrid();
  fitCamera();
  newColony();
  window.addEventListener('resize', resize);
  requestAnimationFrame(loop);
</script>
</body>
</html>
