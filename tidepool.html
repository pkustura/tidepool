<title>Tidepool</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    color-scheme: light dark;
    --bg: #EDF1EA;
    --surface: #E1E8DD;
    --surface-2: #D2DECD;
    --ink: #1C2B22;
    --ink-dim: #56685C;
    --accent: #C2762A;
    --accent-ink: #FFF8EC;
    --line: rgba(28,43,34,0.16);
    --attract: #2E9483;
    --repel: #C9563E;
    --shadow: rgba(20,30,24,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #071615;
      --surface: #0E211F;
      --surface-2: #163330;
      --ink: #E3EFE7;
      --ink-dim: #86A79B;
      --accent: #E3A34D;
      --accent-ink: #201404;
      --line: rgba(227,239,231,0.14);
      --attract: #4FC7B2;
      --repel: #E4785F;
      --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg: #071615;
    --surface: #0E211F;
    --surface-2: #163330;
    --ink: #E3EFE7;
    --ink-dim: #86A79B;
    --accent: #E3A34D;
    --accent-ink: #201404;
    --line: rgba(227,239,231,0.14);
    --attract: #4FC7B2;
    --repel: #E4785F;
    --shadow: rgba(0,0,0,0.5);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration: 0.001ms !important; }
  }

  .stage{ position: fixed; inset: 0; }
  canvas{ position: absolute; inset: 0; width: 100%; height: 100%; display:block; touch-action: none; cursor: crosshair; }

  .tag{
    position: absolute; top: 20px; left: 20px;
    max-width: min(320px, 42vw);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 12px 16px 13px;
    transform: rotate(-0.6deg);
    box-shadow: 0 6px 18px var(--shadow);
  }
  .tag::before{
    content:"";
    position:absolute; top:-7px; left: 22px;
    width: 34px; height: 14px;
    background: color-mix(in srgb, var(--accent) 30%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    transform: rotate(2deg);
  }
  .tag h1{
    margin: 0 0 3px;
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 560;
    font-size: clamp(22px, 3.4vw, 28px);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .tag p{
    margin: 0;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--ink-dim);
    font-style: italic;
    font-family: 'Fraunces', serif;
  }
  .tag .field{
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-dim);
    border-top: 1px dashed var(--line);
    padding-top: 7px;
  }

  .panel{
    position: absolute; top: 20px; right: 20px;
    width: 236px;
    max-width: calc(100vw - 40px);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 6px 18px var(--shadow);
    padding: 14px 14px 15px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .panel h2{
    margin:0; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.11em; text-transform: uppercase;
    color: var(--ink-dim); font-family: 'IBM Plex Mono', monospace;
  }
  .row{ display:flex; gap:8px; }
  button{
    flex: 1;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    padding: 8px 6px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover{ border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  button:focus-visible, input:focus-visible, .step button:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button.primary{
    background: var(--accent); color: var(--accent-ink); border-color: transparent;
  }
  button.primary:hover{ filter: brightness(1.06); }
  button.toggle[aria-pressed="true"]{
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 70%, var(--line));
  }

  .slider{ display:flex; flex-direction:column; gap:4px; }
  .slider .label{
    display:flex; justify-content: space-between; align-items:baseline;
    font-size: 11.5px; color: var(--ink-dim);
  }
  .slider .label b{
    font-family: 'IBM Plex Mono', monospace; font-weight: 500;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100%; height: 3px; border-radius: 2px;
    background: var(--line); outline: none; margin: 3px 0;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background: var(--accent); border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--line); cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%;
    background: var(--accent); border: 2px solid var(--surface); cursor:pointer;
  }

  .step{ display:flex; align-items:center; justify-content: space-between; }
  .step .stepbtns{ display:flex; gap:6px; }
  .step button{ flex:none; width: 26px; height: 26px; padding:0; font-family:'IBM Plex Mono',monospace; }

  .readout{
    position: absolute; bottom: 20px; left: 20px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 6px 18px var(--shadow);
    padding: 12px 14px;
    display:flex; gap: 16px; align-items:center;
  }
  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat span{ font-size: 9.5px; letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-dim); }
  .stat b{
    font-family:'IBM Plex Mono', monospace; font-size: 15px; font-weight:500;
    font-variant-numeric: tabular-nums;
  }

  .matrix{
    position:absolute; bottom: 20px; right: 20px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 6px 18px var(--shadow);
    padding: 11px 13px 12px;
  }
  .matrix h2{
    margin:0 0 8px; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.11em; text-transform: uppercase;
    color: var(--ink-dim); font-family: 'IBM Plex Mono', monospace;
  }
  .grid{ display:grid; gap: 3px; }
  .cell{ width: 16px; height: 16px; border-radius: 2px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .mrow{ display:flex; align-items:center; gap: 4px; }
  .mrow + .mrow{ margin-top: 3px; }
  .legend{
    display:flex; gap: 12px; margin-top: 9px; padding-top: 8px;
    border-top: 1px dashed var(--line); font-size: 10px; color: var(--ink-dim);
  }
  .legend span{ display:flex; align-items:center; gap: 5px; }
  .swatch{ width:9px; height:9px; border-radius:2px; }

  @media (max-width: 620px){
    .tag{ max-width: calc(100vw - 40px); }
    .panel{ top: auto; bottom: 20px; right: 20px; left: 20px; width:auto; }
    .readout, .matrix{ display:none; }
  }
</style>

<div class="stage">
  <canvas id="pool" aria-label="Simulated tidepool of interacting particle colonies"></canvas>

  <header class="tag">
    <h1>Tidepool</h1>
    <p>a colony under glass — nudge the water and watch it reorganize</p>
    <div class="field">Specimen no. <span id="specimenNo">0001</span></div>
  </header>

  <section class="panel" aria-label="Controls">
    <h2>Instrument</h2>
    <div class="row">
      <button class="primary" id="btnNew">New colony</button>
      <button id="btnScatter">Scatter</button>
    </div>
    <button class="toggle" id="btnPause" aria-pressed="false">Pause</button>

    <div class="step">
      <span class="slider label" style="flex:1">Species <b id="speciesVal">5</b></span>
      <div class="stepbtns">
        <button id="specDown" aria-label="Fewer species">−</button>
        <button id="specUp" aria-label="More species">+</button>
      </div>
    </div>

    <label class="slider">
      <span class="label">Population <b id="popVal">650</b></span>
      <input type="range" id="popRange" min="100" max="1400" step="50" value="650">
    </label>

    <label class="slider">
      <span class="label">Momentum <b id="momVal">0.90</b></span>
      <input type="range" id="momRange" min="80" max="99" step="1" value="90">
    </label>

    <label class="slider">
      <span class="label">Reach <b id="reachVal">65</b>px</span>
      <input type="range" id="reachRange" min="30" max="120" step="5" value="65">
    </label>
  </section>

  <div class="readout">
    <div class="stat"><span>Generation</span><b id="genStat">0</b></div>
    <div class="stat"><span>Population</span><b id="popStat">0</b></div>
  </div>

  <aside class="matrix" aria-label="Species affinity matrix">
    <h2>Affinities</h2>
    <div id="matrixGrid"></div>
    <div class="legend">
      <span><i class="swatch" style="background:var(--attract)"></i>attracts</span>
      <span><i class="swatch" style="background:var(--repel)"></i>repels</span>
    </div>
  </aside>
</div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById('pool');
  var ctx = canvas.getContext('2d');
  var dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  var W = 0, H = 0;

  function resize(){
    var r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);

  var PALETTE = [
    { name:'cyan',    hex:'#4FD9E8' },
    { name:'magenta', hex:'#E85FB0' },
    { name:'lime',    hex:'#B7DE3E' },
    { name:'amber',   hex:'#F2A93C' },
    { name:'violet',  hex:'#9B84E8' },
    { name:'rose',    hex:'#EE7F7F' }
  ];

  var COLLISION_R = 13;
  var STIR_RADIUS = 150;
  var STIR_STRENGTH = 0.9;
  var WALL_MARGIN = 28;
  var WALL_FORCE = 0.35;
  var FORCE_SCALE = 0.62;

  var state = {
    speciesCount: 5,
    population: 650,
    momentum: 0.90,
    reach: 65,
    paused: false,
    specimenNo: 1,
    generation: 0
  };

  var px, py, vx, vy, sp, N;
  var rules; // Float32Array speciesCount*speciesCount

  function rnd(a,b){ return a + Math.random()*(b-a); }

  function makeRules(count){
    var m = new Float32Array(count*count);
    for (var i=0;i<count;i++){
      for (var j=0;j<count;j++){
        m[i*count+j] = i===j ? rnd(-0.3, 0.6) : rnd(-1, 1);
      }
    }
    return m;
  }

  function seedParticles(n){
    N = n;
    px = new Float32Array(n); py = new Float32Array(n);
    vx = new Float32Array(n); vy = new Float32Array(n);
    sp = new Uint8Array(n);
    for (var i=0;i<n;i++){
      px[i] = rnd(W*0.1, W*0.9);
      py[i] = rnd(H*0.1, H*0.9);
      vx[i] = 0; vy[i] = 0;
      sp[i] = Math.floor(Math.random()*state.speciesCount);
    }
  }

  function newColony(){
    state.specimenNo++;
    document.getElementById('specimenNo').textContent = String(state.specimenNo).padStart(4,'0');
    rules = makeRules(state.speciesCount);
    seedParticles(state.population);
    state.generation = 0;
    renderMatrix();
  }

  function scatter(){
    for (var i=0;i<N;i++){
      px[i] = rnd(W*0.1, W*0.9);
      py[i] = rnd(H*0.1, H*0.9);
      vx[i] = 0; vy[i] = 0;
    }
  }

  // --- spatial grid ---
  var cellSize, cols, rows, buckets;
  function buildGrid(){
    cellSize = Math.max(20, state.reach);
    cols = Math.max(1, Math.ceil(W/cellSize));
    rows = Math.max(1, Math.ceil(H/cellSize));
    buckets = new Array(cols*rows);
    for (var i=0;i<buckets.length;i++) buckets[i] = [];
  }

  function clearGrid(){
    for (var i=0;i<buckets.length;i++) buckets[i].length = 0;
  }

  function cellIndex(x,y){
    var cx = Math.min(cols-1, Math.max(0, (x/cellSize)|0));
    var cy = Math.min(rows-1, Math.max(0, (y/cellSize)|0));
    return cy*cols+cx;
  }

  // --- pointer stir ---
  var pointer = { active:false, x:0, y:0 };
  function pointerPos(e){
    var r = canvas.getBoundingClientRect();
    var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx, y: cy };
  }
  canvas.addEventListener('pointerdown', function(e){
    pointer.active = true;
    var p = pointerPos(e); pointer.x = p.x; pointer.y = p.y;
  });
  window.addEventListener('pointermove', function(e){
    if (!pointer.active) return;
    var p = pointerPos(e); pointer.x = p.x; pointer.y = p.y;
  });
  window.addEventListener('pointerup', function(){ pointer.active = false; });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  function step(){
    var reach = state.reach;
    var reach2 = reach*reach;
    var col = COLLISION_R;
    var mom = state.momentum;
    var count = state.speciesCount;

    clearGrid();
    for (var i=0;i<N;i++){
      buckets[cellIndex(px[i], py[i])].push(i);
    }

    var fx = new Float32Array(N);
    var fy = new Float32Array(N);

    for (var cy=0; cy<rows; cy++){
      for (var cx=0; cx<cols; cx++){
        var here = buckets[cy*cols+cx];
        for (var a=0; a<here.length; a++){
          var i = here[a];
          for (var dyc=-1; dyc<=1; dyc++){
            var ny = cy+dyc; if (ny<0||ny>=rows) continue;
            for (var dxc=-1; dxc<=1; dxc++){
              var nx = cx+dxc; if (nx<0||nx>=cols) continue;
              var neigh = buckets[ny*cols+nx];
              for (var b=0;b<neigh.length;b++){
                var j = neigh[b];
                if (j<=i) continue;
                var ddx = px[j]-px[i];
                var ddy = py[j]-py[i];
                var d2 = ddx*ddx+ddy*ddy;
                if (d2 > reach2 || d2 < 0.0001) continue;
                var d = Math.sqrt(d2);
                var ux = ddx/d, uy = ddy/d;

                var fij, fji;
                if (d < col){
                  var rep = (d/col - 1);
                  fij = rep; fji = rep;
                } else {
                  var t = (d - col) / (reach - col);
                  var tri = 1 - Math.abs(2*t - 1);
                  fij = rules[sp[i]*count+sp[j]] * tri;
                  fji = rules[sp[j]*count+sp[i]] * tri;
                }
                fx[i] += ux*fij; fy[i] += uy*fij;
                fx[j] -= ux*fji; fy[j] -= uy*fji;
              }
            }
          }
        }
      }
    }

    // pointer stir (tangential swirl)
    if (pointer.active){
      for (var i2=0;i2<N;i2++){
        var ddx2 = px[i2]-pointer.x, ddy2 = py[i2]-pointer.y;
        var d2b = ddx2*ddx2+ddy2*ddy2;
        if (d2b < STIR_RADIUS*STIR_RADIUS && d2b > 1){
          var db = Math.sqrt(d2b);
          var falloff = 1 - db/STIR_RADIUS;
          var ux2 = ddx2/db, uy2 = ddy2/db;
          vx[i2] += (-uy2) * STIR_STRENGTH * falloff;
          vy[i2] += ( ux2) * STIR_STRENGTH * falloff;
        }
      }
    }

    for (var k=0;k<N;k++){
      vx[k] = (vx[k] + fx[k]*FORCE_SCALE) * mom;
      vy[k] = (vy[k] + fy[k]*FORCE_SCALE) * mom;
      var nx2 = px[k]+vx[k], ny2 = py[k]+vy[k];

      if (nx2 < WALL_MARGIN){ vx[k] += (WALL_MARGIN-nx2)*WALL_FORCE*0.1; }
      if (nx2 > W-WALL_MARGIN){ vx[k] -= (nx2-(W-WALL_MARGIN))*WALL_FORCE*0.1; }
      if (ny2 < WALL_MARGIN){ vy[k] += (WALL_MARGIN-ny2)*WALL_FORCE*0.1; }
      if (ny2 > H-WALL_MARGIN){ vy[k] -= (ny2-(H-WALL_MARGIN))*WALL_FORCE*0.1; }

      px[k] = Math.min(W-2, Math.max(2, px[k]+vx[k]));
      py[k] = Math.min(H-2, Math.max(2, py[k]+vy[k]));
    }
  }

  var bgColor = '#EDF1EA';
  function readBg(){
    bgColor = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || bgColor;
  }
  function hexToRgb(hex){
    var v = parseInt(hex.replace('#',''),16);
    return [(v>>16)&255, (v>>8)&255, v&255];
  }
  var bgRgb = hexToRgb('#edf1ea');

  function draw(){
    readBg();
    bgRgb = hexToRgb(bgColor.length===7 ? bgColor : '#edf1ea');
    ctx.fillStyle = 'rgba(' + bgRgb[0]+','+bgRgb[1]+','+bgRgb[2] + ',0.16)';
    ctx.fillRect(0,0,W,H);

    for (var i=0;i<N;i++){
      var c = PALETTE[sp[i] % PALETTE.length].hex;
      ctx.beginPath();
      ctx.fillStyle = c;
      ctx.arc(px[i], py[i], 2.4, 0, Math.PI*2);
      ctx.fill();
    }

    if (pointer.active){
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(140,140,140,0.35)';
      ctx.lineWidth = 1;
      ctx.arc(pointer.x, pointer.y, STIR_RADIUS, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  var genEl = document.getElementById('genStat');
  var popEl = document.getElementById('popStat');

  function loop(){
    if (!state.paused){
      step();
      state.generation++;
    }
    draw();
    if (state.generation % 6 === 0){
      genEl.textContent = state.generation.toLocaleString();
      popEl.textContent = N;
    }
    requestAnimationFrame(loop);
  }

  function renderMatrix(){
    var count = state.speciesCount;
    var grid = document.getElementById('matrixGrid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = '9px repeat(' + count + ', 16px)';
    grid.className = 'grid';

    var headRow = document.createElement('div');
    headRow.style.display = 'contents';
    var blank = document.createElement('div');
    headRow.appendChild(blank);
    for (var c=0;c<count;c++){
      var hd = document.createElement('div');
      hd.style.display='flex'; hd.style.justifyContent='center'; hd.style.alignItems='flex-end';
      var dot = document.createElement('span'); dot.className='dot';
      dot.style.background = PALETTE[c].hex;
      hd.appendChild(dot);
      headRow.appendChild(hd);
    }
    grid.appendChild(headRow);

    for (var r=0;r<count;r++){
      var rowWrap = document.createElement('div');
      rowWrap.style.display = 'contents';
      var rlabel = document.createElement('span'); rlabel.className='dot';
      rlabel.style.background = PALETTE[r].hex;
      rlabel.style.alignSelf = 'center';
      rowWrap.appendChild(rlabel);
      for (var c2=0;c2<count;c2++){
        var val = rules[r*count+c2];
        var cell = document.createElement('div');
        cell.className = 'cell';
        var mag = Math.min(1, Math.abs(val));
        var base = val >= 0 ? 'var(--attract)' : 'var(--repel)';
        cell.style.background = 'color-mix(in srgb, ' + base + ' ' + Math.round(mag*85+8) + '%, var(--surface-2))';
        cell.title = PALETTE[r].name + ' ← ' + PALETTE[c2].name + ': ' + (val>=0?'+':'') + val.toFixed(2);
        rowWrap.appendChild(cell);
      }
      grid.appendChild(rowWrap);
    }
  }

  // --- controls wiring ---
  document.getElementById('btnNew').addEventListener('click', newColony);
  document.getElementById('btnScatter').addEventListener('click', scatter);

  var btnPause = document.getElementById('btnPause');
  btnPause.addEventListener('click', function(){
    state.paused = !state.paused;
    btnPause.setAttribute('aria-pressed', state.paused ? 'true':'false');
    btnPause.textContent = state.paused ? 'Resume' : 'Pause';
  });

  var popRange = document.getElementById('popRange');
  var popVal = document.getElementById('popVal');
  popRange.addEventListener('input', function(){
    state.population = parseInt(popRange.value,10);
    popVal.textContent = state.population;
    seedParticles(state.population);
  });

  var momRange = document.getElementById('momRange');
  var momVal = document.getElementById('momVal');
  momRange.addEventListener('input', function(){
    state.momentum = parseInt(momRange.value,10)/100;
    momVal.textContent = state.momentum.toFixed(2);
  });

  var reachRange = document.getElementById('reachRange');
  var reachVal = document.getElementById('reachVal');
  reachRange.addEventListener('input', function(){
    state.reach = parseInt(reachRange.value,10);
    reachVal.textContent = state.reach;
    buildGrid();
  });

  var speciesVal = document.getElementById('speciesVal');
  document.getElementById('specUp').addEventListener('click', function(){
    if (state.speciesCount < 6){ state.speciesCount++; speciesVal.textContent = state.speciesCount; newColony(); }
  });
  document.getElementById('specDown').addEventListener('click', function(){
    if (state.speciesCount > 2){ state.speciesCount--; speciesVal.textContent = state.speciesCount; newColony(); }
  });

  // --- init ---
  resize();
  buildGrid();
  newColony();
  window.addEventListener('resize', function(){ resize(); buildGrid(); });
  requestAnimationFrame(loop);
})();
</script>
